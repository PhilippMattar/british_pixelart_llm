# bpx model registry — see PLAN.md §4.2.
# Adding a model is data-only: append a [[models]] block, no code changes.
#   provider:    "ollama" | "openai_compat"
#   endpoint:    OpenAI-compatible base URL (…/v1)
#   api_key_env: env var holding the key (blank -> local Ollama placeholder)
#
# NOTE: PLAN.md §3 locks the persona *base* as qwen3:8b. This machine currently has
# qwen3.5 + gemma3:1b, so the Phase-0 defaults below point at what is installed so the
# streaming loop runs today. Reconcile the base tag before Phase 2 / gate G1 (§7.1).

# Standard non-persona model + the persona base (§3 lock). Thinking stays ON here (no
# reasoning_effort) — the TUI streams the reasoning so a long think shows progress; only the
# fine-tuned personas below force thinking off.
[[models]]
name = "qwen"
provider = "ollama"
endpoint = "http://localhost:11434/v1"
model_id = "qwen3:8b"
api_key_env = ""
is_persona = false
keywords = []

[[models]]
name = "gemma"
provider = "ollama"
endpoint = "http://localhost:11434/v1"
model_id = "gemma3:1b"
api_key_env = ""
is_persona = false
keywords = []

# Fine-tuned personas (Phase 2, §7.3) — the keyword router auto-switches to these.
# model_id points at the Ollama models created from the LoRA adapters
# (`ollama create bpx-british -f models/Modelfile.british`; likewise scottish).
# reasoning_effort = "none" is REQUIRED: the adapters were trained non-thinking (§3 lock), so
# they must be served with thinking OFF or they leak stray tokens (see models/Modelfile.*).
# Lexicons live in the router module, so keywords[] here stays empty.

[[models]]
name = "british"
provider = "ollama"
endpoint = "http://localhost:11434/v1"
model_id = "bpx-british"
api_key_env = ""
is_persona = true
reasoning_effort = "none"
keywords = []

[[models]]
name = "scottish"
provider = "ollama"
endpoint = "http://localhost:11434/v1"
model_id = "bpx-scottish"
api_key_env = ""
is_persona = true
reasoning_effort = "none"
keywords = []
